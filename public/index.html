 <!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#681126"><title>PEAK AI</title>
<style>
:root{--bg:#FBFAF7;--panel:#FFFFFF;--panel2:#F8F4EA;--line:#E8DCC2;--text:#29251F;--muted:#82796B;--accent:#B58A3C;--accent2:#806020;--user:#F5EBD7;--shadow:0 16px 48px rgba(105,78,28,.09);--gold:#B58A3C;--gold-soft:#E9D6A6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
button,textarea,input{font:inherit}button{cursor:pointer;color:inherit}
.app{height:100vh;display:flex}
.sidebar{width:270px;flex:0 0 270px;background:linear-gradient(180deg,#FFFEFC 0%,#F7F2E8 100%);border-right:1px solid #DCC99F;display:flex;flex-direction:column;padding:18px 14px;transition:.2s;box-shadow:5px 0 24px rgba(111,83,34,.04)}
.sidebar.collapsed{width:0;flex-basis:0;padding-left:0;padding-right:0;border:0;overflow:hidden;box-shadow:none}
.brand{display:flex;align-items:center;gap:10px;padding:5px 48px 22px 8px;position:relative}
.sidebar-back{position:absolute;right:3px;top:4px;width:34px;height:34px;border:1px solid #DCC99F;background:linear-gradient(145deg,#fff,#F5EBD6);border-radius:10px;color:#806020;font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:0 3px 10px rgba(105,78,28,.07);transition:.18s}
.sidebar-back:hover{border-color:#B58A3C;background:#F8F1E2;transform:translateX(-2px)}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#E7D4A2,#A77B2D 55%,#76521D);display:grid;place-items:center;color:#fffdf6;font-weight:900;font-size:21px;border:1px solid #C5A45F;box-shadow:inset 0 1px 2px #fff8df,0 5px 15px rgba(126,91,29,.22);text-shadow:0 1px 2px rgba(73,48,8,.35)}
.brand-name{font-size:18px;font-weight:850;letter-spacing:2.4px;color:#806020}
.brand-sub{font-size:9px;color:#9A835A;letter-spacing:1.8px;margin-top:-3px}
.new-chat{border:1px solid #C9AD70;background:linear-gradient(135deg,#FFFDF7,#F1E5C9);border-radius:12px;padding:11px 13px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:650;color:#76551E;box-shadow:inset 0 1px 0 #fff,0 4px 13px rgba(130,94,30,.08)}
.new-chat:hover{background:linear-gradient(135deg,#fff,#EAD8AD);border-color:#A77B2D}
.side-label{font-size:11px;color:#9A896A;padding:23px 9px 8px;text-transform:uppercase;letter-spacing:1.2px}
.history{overflow:auto;flex:1}
.history-item{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:#625B50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.history-item:hover,.history-item.active{background:#F1E8D5;color:#76551E}
.side-bottom{border-top:1px solid #E5D9BF;padding-top:13px}
.profile{display:flex;align-items:center;gap:10px;padding:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#F7EBCB,#C5A45F);display:grid;place-items:center;color:#6D501D;font-weight:800;border:1px solid #C5A45F;box-shadow:inset 0 1px 2px #fff}
.profile small{display:block;color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse at 50% 0%,#FFFFFF 0%,#FBFAF7 68%)}
.topbar{height:64px;border-bottom:1px solid #E8DCC2;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,254,250,.92);backdrop-filter:blur(14px)}
.topbar-left{display:flex;align-items:center;gap:13px;min-width:0}
.menu-btn{width:38px;height:38px;border:1px solid #DCC99F;background:linear-gradient(145deg,#fff,#F5EBD6);border-radius:11px;color:#806020;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(105,78,28,.07)}
.menu-btn:hover{border-color:#B58A3C;background:#F8F1E2}
.model{display:flex;align-items:center;gap:9px;font-weight:700;color:#806020}
.status-dot{width:7px;height:7px;background:#B58A3C;border-radius:50%;box-shadow:0 0 9px rgba(181,138,60,.55)}
.top-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border:1px solid #E5D9BF;background:#FFFEFB;border-radius:10px;color:#806B45;font-size:16px}
.icon-btn:hover{border-color:#B58A3C;background:#F8F1E2}
.welcome h1,.welcome-title{color:#4A3A20}
.card,.suggestion,.tool-card{border:1px solid #E5D9BF;background:linear-gradient(145deg,#FFFFFF,#FBF8F0);box-shadow:0 8px 25px rgba(105,78,28,.055)}
.card:hover,.suggestion:hover,.tool-card:hover{border-color:#C6A45F;box-shadow:0 10px 28px rgba(145,105,35,.11)}
.composer,.input-area,.chat-input{background:#FFFFFF;border:1px solid #D8C69F;box-shadow:0 8px 28px rgba(105,78,28,.09),inset 0 1px 0 #fff}
.composer:focus-within,.input-area:focus-within,.chat-input:focus-within{border-color:#B58A3C;box-shadow:0 0 0 3px rgba(181,138,60,.12),0 10px 28px rgba(105,78,28,.08)}
.send-btn,.send-button{background:linear-gradient(145deg,#E8D39B,#B58A3C 55%,#8A6428);color:#fff;border:1px solid #B58A3C;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 4px 12px rgba(128,91,27,.22)}
.send-btn:hover,.send-button:hover{filter:brightness(1.06);box-shadow:0 0 15px rgba(181,138,60,.28)}
.user-message,.message.user{background:transparent;border:0;color:#332A1B}
.assistant-message,.message.assistant{color:#302B23}
button:focus-visible{outline:2px solid #B58A3C;outline-offset:2px}


.content{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center}
.welcome{width:min(780px,calc(100% - 36px));margin:auto;padding:45px 0 80px}
.welcome-mark{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#fff8df,#d6b66d 55%,#9a712d);display:grid;place-items:center;color:#76551e;box-shadow:0 10px 32px rgba(154,113,45,.16);margin-bottom:24px;border:1px solid #d5bd83}
.welcome h1{font-size:clamp(30px,5vw,43px);line-height:1.15;letter-spacing:-1.4px;margin:0 0 12px}
.welcome p{color:var(--muted);margin:0 0 30px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.suggestion{border-radius:13px;padding:15px;text-align:left;color:#514633;transition:.15s}
.suggestion b{display:block;font-size:13px;margin-bottom:4px;color:#806020}
.suggestion span{font-size:12px;color:#82796b}
.messages{width:min(1000px,calc(100% - 48px));margin-inline:auto;padding:30px 0 24px;display:flex;flex-direction:column;gap:25px}
.message{display:flex;gap:13px;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;background:linear-gradient(145deg,#fff1c9,#c5a45f);color:#76551e;border:1px solid #d8c18b}
.message.user .msg-avatar{background:#f1eee7;color:#655b4b;border-color:#e2d9c8}
.bubble{max-width:min(690px,calc(100% - 45px));padding:2px 0;color:#302b23;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user .bubble{background:#FFFFFF;border:1px solid #E8E3D8;padding:11px 15px;border-radius:16px 5px 16px 16px;color:#332A1B;box-shadow:0 2px 8px rgba(35,25,10,.035)}
.message.assistant .bubble{padding-top:2px}
.composer-wrap{width:min(1000px,calc(100% - 48px));margin-inline:auto;flex:0 0 auto;padding:12px 0 18px}
.composer{border-radius:18px;padding:12px 13px 10px}
.composer textarea{width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);min-height:30px;max-height:180px;padding:4px 4px 8px}
.composer textarea::placeholder{color:#a19888}
.composer-bottom{display:flex;align-items:center;justify-content:space-between}
.hint{font-size:11px;color:#928875;padding-left:4px}
.send{width:36px;height:36px;border:0;border-radius:11px;background:linear-gradient(145deg,#f4dfaa,#bd9348 58%,#8a6428);color:white;font-size:18px;font-weight:800;box-shadow:inset 0 1px 0 #fff9,0 4px 12px #80602024}
.send:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fffdf8;border:1px solid #d8c69f;padding:9px 14px;border-radius:10px;color:#514633;font-size:12px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}
.toast.show{opacity:1}
.typing{display:flex;gap:5px;padding:9px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:#b58a3c;animation:pulse 1s infinite alternate}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes pulse{to{opacity:.25;transform:translateY(-3px)}}
@media(max-width:700px){.app{min-width:0;position:relative}.sidebar{position:absolute;z-index:20;left:0;top:0;bottom:0;width:245px;flex:0 0 245px;padding:14px 10px;box-shadow:8px 0 28px rgba(45,35,18,.16);transform:translateX(-105%);transition:transform .22s ease}.sidebar.open{transform:translateX(0)}.sidebar.collapsed{width:245px;flex-basis:245px;padding:14px 10px;border-right:1px solid #DCC99F;transform:translateX(-105%)}.topbar{padding:0 13px}.welcome{padding:35px 0 60px}.suggestions{grid-template-columns:1fr}.messages{padding-top:20px}.hint{font-size:10px}.brand-sub{letter-spacing:1px}.brand-name{letter-spacing:1.5px}.new-chat{font-size:12px;padding:10px 8px}}


.tool-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
.tool-btn{border:1px solid #e5d9bf;background:#fffdf8;color:#806020;border-radius:10px;padding:7px 10px;font-size:12px}
.tool-btn:hover{border-color:#b58a3c;background:#f8f1e2}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:#f7f0df;border:1px solid #e5d9bf;border-radius:9px;padding:5px 9px;font-size:12px;color:#76551e;margin:4px 0}
.message-image{display:block;max-width:min(420px,100%);max-height:420px;border-radius:12px;border:1px solid #e5d9bf;margin-top:8px}
.voice-panel{position:fixed;inset:0;background:#211a10aa;z-index:50;display:none;place-items:center;padding:18px}
.voice-panel.show{display:grid}
.voice-card{width:min(420px,100%);background:#fffdf8;border:1px solid #d8c69f;border-radius:22px;padding:25px;text-align:center;box-shadow:0 20px 70px #0003}
.voice-orb{width:112px;height:112px;border-radius:50%;margin:18px auto;background:radial-gradient(circle,#fff4cc,#d5b56d 60%,#9b712c);display:grid;place-items:center;color:#76551e;font-size:38px;box-shadow:0 0 0 12px #d5b56d22}
.voice-status{font-size:13px;color:#82796b;min-height:24px}
.voice-actions{display:flex;justify-content:center;gap:10px;margin-top:18px}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo" aria-label="Vương miện hoàng gia"><svg class="royal-crown" viewBox="0 0 100 76" aria-hidden="true" focusable="false"><defs><linearGradient id="crownGold" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#fff2bd"/><stop offset=".28" stop-color="#f5d477"/><stop offset=".62" stop-color="#bd842b"/><stop offset="1" stop-color="#ffe8a0"/></linearGradient></defs><path d="M10 20 L29 37 L40 8 L51 35 L66 5 L74 37 L91 19 L84 61 Q50 70 16 61 Z" fill="url(#crownGold)" stroke="#ffe8a0" stroke-width="2.6" stroke-linejoin="round"/><path d="M16 53 Q50 62 84 53 L81 66 Q50 74 19 66 Z" fill="#9d6b20" stroke="#f6d77e" stroke-width="2"/><path d="M10 20 L18 16 L29 33 L40 8 L46 31 L51 35 L66 5 L70 33 L74 37 L91 19 L95 23 L84 48 Q50 57 16 48 Z" fill="none" stroke="#fff0b5" stroke-width="1.8"/><g fill="#fff4c8"><circle cx="29" cy="37" r="2"/><circle cx="66" cy="5" r="2.2"/><circle cx="91" cy="19" r="2"/></g></svg></div><div><div class="brand-name">PEAK</div><div class="brand-sub">YOUR AI SPACE</div></div><button class="sidebar-back" id="sidebarBack" type="button" aria-label="Thu gọn thanh bên" title="Thu gọn thanh bên">‹</button></div>
<button class="new-chat" id="newChat"><span>＋</span> Cuộc trò chuyện mới</button><div class="side-label">Gần đây</div><div class="history" id="history"></div>
<div class="side-bottom"><div class="profile"><div class="avatar">U</div><div><b style="font-size:13px">Người dùng</b><small>Không gian cá nhân</small></div></div></div></aside>
<main class="main"><header class="topbar"><div class="topbar-left"><button class="menu-btn" id="menuToggle" type="button" aria-label="Mở hoặc đóng thanh bên" aria-controls="sidebar" aria-expanded="true">☰</button><div class="model"><span class="status-dot"></span><span>PEAK</span></div></div><div class="top-actions"><button class="icon-btn" id="clearBtn" title="Xóa cuộc trò chuyện">⌫</button></div></header>
<section class="content" id="content"><div class="welcome" id="welcome"><div class="welcome-mark"><svg class="royal-crown" viewBox="0 0 100 76" aria-hidden="true" focusable="false"><defs><linearGradient id="crownGold" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#fff2bd"/><stop offset=".28" stop-color="#f5d477"/><stop offset=".62" stop-color="#bd842b"/><stop offset="1" stop-color="#ffe8a0"/></linearGradient></defs><path d="M10 20 L29 37 L40 8 L51 35 L66 5 L74 37 L91 19 L84 61 Q50 70 16 61 Z" fill="url(#crownGold)" stroke="#ffe8a0" stroke-width="2.6" stroke-linejoin="round"/><path d="M16 53 Q50 62 84 53 L81 66 Q50 74 19 66 Z" fill="#9d6b20" stroke="#f6d77e" stroke-width="2"/><path d="M10 20 L18 16 L29 33 L40 8 L46 31 L51 35 L66 5 L70 33 L74 37 L91 19 L95 23 L84 48 Q50 57 16 48 Z" fill="none" stroke="#fff0b5" stroke-width="1.8"/><g fill="#fff4c8"><circle cx="29" cy="37" r="2"/><circle cx="66" cy="5" r="2.2"/><circle cx="91" cy="19" r="2"/></g></svg></div><h1>Xin chào, tôi là <span class="gradient">PEAK.</span></h1><p>Không gian AI của riêng bạn. Hôm nay chúng ta sẽ cùng tạo ra điều gì?</p><div class="suggestions"><button class="suggestion" data-prompt="Giải thích trí tuệ nhân tạo bằng cách dễ hiểu."><b>✦ Khám phá AI</b><span>Giải thích một chủ đề khó theo cách đơn giản</span></button><button class="suggestion" data-prompt="Giúp tôi lên kế hoạch học tập hiệu quả trong tuần này."><b>▦ Lập kế hoạch</b><span>Sắp xếp mục tiêu và công việc</span></button><button class="suggestion" data-prompt="Gợi ý ý tưởng cho một dự án website sáng tạo."><b>⌘ Sáng tạo ý tưởng</b><span>Bắt đầu một dự án mới</span></button><button class="suggestion" data-prompt="Viết một đoạn giới thiệu ngắn cho dự án của tôi."><b>✎ Hỗ trợ viết</b><span>Biến ý tưởng thành nội dung rõ ràng</span></button></div></div><div class="messages" id="messages" hidden></div></section>
<div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Nhắn tin cho PEAK..." aria-label="Tin nhắn"></textarea><div class="composer-bottom"><span class="hint">Enter để gửi · Shift + Enter để xuống dòng</span><button class="send" id="send" aria-label="Gửi" disabled>↑</button></div><div class="tool-row"><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,text/csv,.docx" hidden><button class="tool-btn" id="attachBtn" type="button">＋ Ảnh / Tệp</button><button class="tool-btn" id="generateBtn" type="button">✦ Tạo ảnh</button><button class="tool-btn" id="voiceBtn" type="button">🎙 Voice</button><span id="selectedFile" class="file-chip" hidden></span></div></div></div></main></div><div class="toast" id="toast"></div><div class="voice-panel" id="voicePanel"><div class="voice-card"><b style="color:#806020;letter-spacing:2px">PEAK VOICE</b><div class="voice-orb">♫</div><div class="voice-status" id="voiceStatus">Đang chuẩn bị kết nối…</div><div class="voice-actions"><button class="tool-btn" id="voiceMute">Tắt micro</button><button class="tool-btn" id="voiceEnd">Kết thúc</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
// PEAK — chat requests are handled by the protected server backend.
const PEAK_API_URL = '/api/chat';
const $=s=>document.querySelector(s);let chats=[],activeId=null,busy=false;
try{chats=JSON.parse(localStorage.getItem('peak_chats')||'[]')}catch{chats=[]}
function save(){localStorage.setItem('peak_chats',JSON.stringify(chats))}
function current(){return chats.find(c=>c.id===activeId)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderHistory(){const el=$('#history');el.innerHTML='';chats.slice().reverse().forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===activeId?' active':'');b.textContent=c.title;b.onclick=()=>openChat(c.id);el.append(b)})}
function showWelcome(){activeId=null;$('#welcome').hidden=false;$('#messages').hidden=true;$('#messages').innerHTML='';renderHistory()}
function openChat(id){activeId=id;const c=current();$('#welcome').hidden=true;$('#messages').hidden=false;$('#messages').innerHTML='';c.messages.forEach(m=>addMessage(m.role,m.text,false));renderHistory();$('#sidebar').classList.remove('open');scrollBottom()}
function addMessage(role,text,scroll=true){const row=document.createElement('div');row.className='message '+role;const av=document.createElement('div');av.className='msg-avatar';av.textContent=role==='user'?'U':'P';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.append(av,bubble);$('#messages').append(row);if(scroll)scrollBottom();return row}
function scrollBottom(){const c=$('#content');c.scrollTop=c.scrollHeight}
function newChat(){showWelcome();$('#prompt').focus()}
function titleFrom(s){return s.length> thirty? s.slice(0,thirty)+'…':s}const thirty=38;
async function getReply(q,c){
  const body={message:q,previousInteractionId:c.interactionId||null};
  // If this chat was created in the demo version, provide its recent local history once.
  if(!c.interactionId){
    const earlier=c.messages.slice(0,-1).slice(-10).map(m=>(m.role==='user'?'Người dùng':'PEAK')+': '+m.text).join('\n');
    if(earlier)body.message='Lịch sử cuộc trò chuyện trước đó:\n'+earlier+'\n\nTin nhắn mới của người dùng:\n'+q;
  }
  const r=await fetch(PEAK_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Không thể kết nối.');
  return {reply:d.reply||'Chưa nhận được phản hồi.',interactionId:d.interactionId||c.interactionId||null};
}
async function send(){const input=$('#prompt'),q=input.value.trim();if(!q||busy)return;if(!activeId){const c={id: (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function")
  ? crypto.randomUUID()
  : "peak-" + Date.now() + "-" + Math.random().toString(36).slice(2),title:titleFrom(q),messages:[]};chats.push(c);activeId=c.id;$('#welcome').hidden=true;$('#messages').hidden=false;$('#messages').innerHTML=''}const c=current();c.messages.push({role:'user',text:q});addMessage('user',q);input.value='';resize();busy=true;$('#send').disabled=true;const typing=addMessage('assistant','');typing.querySelector('.bubble').innerHTML='<span class="typing"><i></i><i></i><i></i></span>';let reply;try{const result=await getReply(q,c);reply=result.reply;c.interactionId=result.interactionId||c.interactionId||null}catch(err){reply='Lỗi: '+(err.message||'Không thể kết nối PEAK.')}typing.querySelector('.bubble').textContent=reply;c.messages.push({role:'assistant',text:reply});busy=false;$('#send').disabled=false;save();renderHistory();scrollBottom()}
function resize(){const t=$('#prompt');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px';$('#send').disabled=!t.value.trim()||busy}
const menuToggle=$('#menuToggle');function toggleSidebar(){const sidebar=$('#sidebar');if(window.matchMedia('(max-width:700px)').matches){sidebar.classList.toggle('open');menuToggle.setAttribute('aria-expanded',sidebar.classList.contains('open')?'true':'false')}else{sidebar.classList.toggle('collapsed');menuToggle.setAttribute('aria-expanded',sidebar.classList.contains('collapsed')?'false':'true')}}menuToggle.addEventListener('click',toggleSidebar);$('#sidebarBack').addEventListener('click',toggleSidebar);$('#send').onclick=send;$('#prompt').addEventListener('input',resize);$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#newChat').onclick=newChat;$('#clearBtn').onclick=()=>{if(!activeId){toast('Chưa có cuộc trò chuyện để xóa.');return}chats=chats.filter(c=>c.id!==activeId);save();newChat();toast('Đã xóa cuộc trò chuyện.')};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#prompt').value=b.dataset.prompt;resize();send()});renderHistory();if(chats.length)openChat(chats[chats.length-1].id);

// Attachments: image/PDF/TXT/CSV are sent as multimodal input. DOCX is converted to text in-browser.
let selectedFile = null;
const fileInput = $('#fileInput');
$('#attachBtn').onclick = () => fileInput.click();
fileInput.addEventListener('change', () => {
  selectedFile = fileInput.files?.[0] || null;
  const chip = $('#selectedFile');
  chip.hidden = !selectedFile;
  chip.textContent = selectedFile ? '📎 ' + selectedFile.name : '';
  if (selectedFile && !$('#prompt').value.trim()) $('#prompt').placeholder = 'Bạn muốn PEAK làm gì với tệp này?';
  resize();
});
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
async function sendAttachment(question, file, c){
  const mime=file.type || (file.name.toLowerCase().endsWith('.pdf')?'application/pdf':'');
  if(file.name.toLowerCase().endsWith('.docx')){
    if(!window.JSZip) throw new Error('Không tải được bộ đọc Word. Hãy thử lại khi có kết nối Internet.');
    const zip=await JSZip.loadAsync(file);
    const doc=await zip.file('word/document.xml')?.async('string');
    if(!doc) throw new Error('Không đọc được nội dung DOCX.');
    const xml=new DOMParser().parseFromString(doc,'text/xml');
    const textContent=[...xml.getElementsByTagName('w:t')].map(n=>n.textContent||'').join(' ');
    if(!textContent.trim()) throw new Error('Tài liệu Word không có văn bản đọc được.');
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:(question||'Hãy phân tích tài liệu này.')+'\\n\\nNội dung tài liệu '+file.name+':\\n'+textContent.slice(0,80000),previousInteractionId:c.interactionId||null})});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Không xử lý được tài liệu Word.');
    c.interactionId=d.interactionId||c.interactionId;return d.reply;
  }
  const data=await fileToBase64(file);
  const r=await fetch('/api/chat-media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:question,fileName:file.name,mimeType:mime,data})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Không thể phân tích tệp.');
  return d.reply;
}
send = async function(){
  const input=$('#prompt'), q=input.value.trim();
  if(!q && !selectedFile)return;
  if(busy)return;
  const file=selectedFile;
  if(!activeId){const c={id:(typeof crypto!=="undefined"&&crypto.randomUUID)?crypto.randomUUID():"peak-"+Date.now(),title:titleFrom(q||file.name),messages:[]};chats.push(c);activeId=c.id;$('#welcome').hidden=true;$('#messages').hidden=false;$('#messages').innerHTML=''}
  const c=current();const display=q||(file?'Hãy phân tích tệp: '+file.name:'');
  c.messages.push({role:'user',text:display});addMessage('user',display);
  if(file && file.type.startsWith('image/')){const preview=document.createElement('img');preview.className='message-image';preview.src=URL.createObjectURL(file);$('#messages').lastElementChild.querySelector('.bubble').append(preview)}
  input.value='';selectedFile=null;fileInput.value='';$('#selectedFile').hidden=true;resize();busy=true;$('#send').disabled=true;
  const typing=addMessage('assistant','');typing.querySelector('.bubble').innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  let reply;
  try{reply=file?await sendAttachment(q,file,c):(await getReply(q,c)).reply}
  catch(err){reply='Lỗi: '+(err.message||'Không thể kết nối PEAK.')}
  typing.querySelector('.bubble').textContent=reply;c.messages.push({role:'assistant',text:reply});busy=false;$('#send').disabled=false;save();renderHistory();scrollBottom();
};
$('#send').onclick=send;
$('#generateBtn').onclick=async()=>{
  const prompt=$('#prompt').value.trim();
  if(!prompt){toast('Hãy nhập mô tả hình ảnh muốn tạo trước.');$('#prompt').focus();return}
  if(busy)return;busy=true;$('#send').disabled=true;toast('PEAK đang tạo ảnh…');
  try{
    const r=await fetch('/api/generate-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Không tạo được ảnh.');
    if(!activeId){const c={id:'peak-'+Date.now(),title:titleFrom(prompt),messages:[]};chats.push(c);activeId=c.id;$('#welcome').hidden=true;$('#messages').hidden=false}
    const row=addMessage('assistant',d.text||'Ảnh đã được tạo.');const img=document.createElement('img');img.className='message-image';img.src=d.image;img.alt='Ảnh do PEAK tạo';row.querySelector('.bubble').append(img);
    const c=current();c.messages.push({role:'assistant',text:'Ảnh đã được tạo.'});save();renderHistory();$('#prompt').value='';resize();
  }catch(e){toast(e.message)}finally{busy=false;resize()}
};

// Gemini Live voice: short-lived token; audio remains in the browser and the permanent key stays server-side.
let liveSocket=null, micStream=null, audioCtx=null, processor=null, micSource=null, voiceMuted=false, nextPlayAt=0;
function b64(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function fromB64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function startVoice(){
  $('#voicePanel').classList.add('show');$('#voiceStatus').textContent='Đang xin quyền micro…';
  try{
    const tokenRes=await fetch('/api/live-token',{method:'POST'});const tokenData=await tokenRes.json();if(!tokenRes.ok)throw new Error(tokenData.error||'Không lấy được mã Voice.');
    micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    liveSocket=new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token='+encodeURIComponent(tokenData.token));
    liveSocket.onopen=()=>liveSocket.send(JSON.stringify({setup:{model:'models/'+tokenData.model,generationConfig:{responseModalities:['AUDIO']},systemInstruction:{parts:[{text:'Bạn là PEAK, trợ lý AI thân thiện. Trả lời bằng tiếng Việt tự nhiên, ngắn gọn khi trò chuyện bằng giọng nói.'}]}}}));
    liveSocket.onmessage=async(ev)=>{
      const msg=JSON.parse(ev.data);
      if(msg.setupComplete){$('#voiceStatus').textContent='Đang nghe bạn nói…';micSource=audioCtx.createMediaStreamSource(micStream);processor=audioCtx.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>{if(voiceMuted||liveSocket?.readyState!==1)return;const f=e.inputBuffer.getChannelData(0),pcm=new Int16Array(f.length);for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));pcm[i]=v<0?v*32768:v*32767}liveSocket.send(JSON.stringify({realtimeInput:{mediaChunks:[{mimeType:'audio/pcm;rate=16000',data:b64(new Uint8Array(pcm.buffer))}]}}))};micSource.connect(processor);const silentGain=audioCtx.createGain();silentGain.gain.value=0;processor.connect(silentGain);silentGain.connect(audioCtx.destination)}
      const parts=msg.serverContent?.modelTurn?.parts||[];
      for(const part of parts){const data=part.inlineData?.data;if(data){const raw=fromB64(data);const pcm=new Int16Array(raw.buffer);const buf=audioCtx.createBuffer(1,pcm.length,24000);const channel=buf.getChannelData(0);for(let i=0;i<pcm.length;i++)channel[i]=pcm[i]/32768;const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);const now=audioCtx.currentTime;nextPlayAt=Math.max(nextPlayAt,now);src.start(nextPlayAt);nextPlayAt+=buf.duration}}
      if(msg.serverContent?.turnComplete)$('#voiceStatus').textContent='PEAK đã trả lời · Bạn có thể nói tiếp';
    };
    liveSocket.onerror=()=>$('#voiceStatus').textContent='Kết nối Voice gặp lỗi.';
    liveSocket.onclose=()=>$('#voiceStatus').textContent='Đã ngắt kết nối.';
  }catch(e){$('#voiceStatus').textContent=e.message||'Không thể bật Voice.'}
}
function stopVoice(){try{processor?.disconnect();micSource?.disconnect();micStream?.getTracks().forEach(t=>t.stop());liveSocket?.close();audioCtx?.close()}catch{}processor=null;micSource=null;micStream=null;liveSocket=null;audioCtx=null;$('#voicePanel').classList.remove('show')}
$('#voiceBtn').onclick=startVoice;$('#voiceEnd').onclick=stopVoice;$('#voiceMute').onclick=()=>{voiceMuted=!voiceMuted;$('#voiceMute').textContent=voiceMuted?'Bật micro':'Tắt micro';$('#voiceStatus').textContent=voiceMuted?'Micro đang tắt':'Đang nghe bạn nói…'};

</script></body></html>
